name: Import 2000 World Bank baselines

on:
  push:
    branches: [main]
    paths:
      - "scripts/import-world-bank-data.mjs"
      - ".github/workflows/import-world-bank-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import historical World Bank indicators
        run: node scripts/import-world-bank-data.mjs

      - name: Validate generated historical datasets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path("data/economy/country-baselines-2000.json"),
              Path("data/military/personnel-2000.json"),
          ]
          for path in paths:
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data.get("countries"), dict):
                  raise SystemExit(f"Invalid country registry in {path}")
              print(f"{path}: {len(data['countries'])} country records")
          PY

      - name: Commit imported datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/economy/country-baselines-2000.json data/military/personnel-2000.json
          if git diff --cached --quiet; then
            echo "Historical datasets are already up to date."
          else
            git commit -m "Import World Bank historical baselines for 2000"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
